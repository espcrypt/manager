name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpcsclite-dev
      - name: Vet and test the shared packages
        shell: bash
        run: |
          go vet ./internal/...
          go test ./internal/...

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install Wails CLI
        shell: bash
        run: bash scripts/install-wails.sh
      - name: Build the macOS app (universal)
        run: wails build -platform darwin/universal -clean
      - name: Check the app bundle
        run: |
          test -d "build/bin/ESP Crypt.app"
          lipo -info "build/bin/ESP Crypt.app/Contents/MacOS/"*

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install Wails CLI
        shell: bash
        run: bash scripts/install-wails.sh
      - name: Build the Windows app
        run: wails build -platform windows/amd64 -clean
